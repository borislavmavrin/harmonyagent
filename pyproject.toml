[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyagent"
dynamic = ["version"]
description = "Native Harmony Agent for gpt-oss"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["nlp", "agents", "code", "harmony", "gpt-oss"]
authors = [
    {name = "Borislav Mavrin", email = "borislav.maavrin@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "pyyaml",
    "requests",
    "jinja2",
    "tenacity",
    "rich",
    "python-dotenv",
    "typer",
    "platformdirs",
    "textual",
    "prompt_toolkit",
    "openai!=1.100.0,!=1.100.1",
    "unidiff",
    "openai_harmony",
    "jupyter-client==8.8.0",
    "ipykernel==7.2.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.5",
    "datasets==4.6.1",
    "pytest-cov==7.0.0",
    "matplotlib>=3.10.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "harmonyagent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["harmonyagent*"]

[tool.setuptools.package-data]
harmonyagent = ["config/**/*"]

[tool.ruff]
exclude = ["tests/test_data", "config/commands"]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "PLE", "W605",
    "F401", "F541", "F632", "F821", "F822", "F841", "F901",
    "I",
    "UP",
    "C401", "C402", "C403", "C404", "C405",
    "B006", "B007", "B009",
    "EM", "RET", "PT",
    "RUF019", "SIM201",
    "PTH100", "PTH110", "PTH111", "PTH112", "PTH113", "PTH114",
    "PTH117", "PTH118", "PTH119", "PTH120", "PTH121", "PTH122",
    "PTH202", "PTH203", "PTH204", "PTH205",
]
ignore = [
    "RET505", "RET506", "RET507",
    "E501", "E402", "E722", "E741",
    "PT011", "PT018",
    "EM101", "EM102", "EM103",
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.typos.default.extend-identifiers]
ACI = "ACI"

[tool.typos.default.extend-words]
aci = "aci"
ba = "ba"

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "missing-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "unspecified-encoding",
    "duplicate-code",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]
